name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          # Maven Central sometimes rate-limits shared runners; retry a few times.
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then break; fi
            if ! grep -q "429" build.log || [ "$attempt" = 4 ]; then exit 1; fi
            echo "Rate limited, retrying in $((attempt * 60))s"; sleep $((attempt * 60))
          done
          cp app/build/outputs/apk/release/app-release.apk Xavine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Xavine-apk
          path: Xavine.apk

      - name: Publish as a release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Xavine build ${{ github.run_number }}
          files: Xavine.apk
          make_latest: true

      - name: Share the build log if it failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Build log ${{ github.run_number }} (failed)
          files: build.log
          prerelease: true
          make_latest: false
