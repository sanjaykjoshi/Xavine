plugins {
    id 'com.android.application'
}

android {
    namespace 'app.xavine'
    compileSdk 35

    defaultConfig {
        applicationId 'app.xavine'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    // Fixed key so each new build installs as an update.
    signingConfigs {
        shared {
            storeFile file('xavine.keystore')
            storePassword 'xavinekey'
            keyAlias 'xavine'
            keyPassword 'xavinekey'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.4.0'
}
